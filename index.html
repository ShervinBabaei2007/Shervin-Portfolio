<!doctype html>
<html lang="en-CA" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#09090b" />
    <script>
      // Apply the theme before first paint so there is no flash. Dark is the default. Mirrors src/hooks/useTheme.ts.
      try {
        var pref = localStorage.getItem('color-scheme');
        var scheme = pref === 'light' ? 'light'
          : pref === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : 'dark';
        var root = document.documentElement;
        root.dataset.theme = scheme;
        root.classList.toggle('dark', scheme === 'dark');
        document.querySelector('meta[name="color-scheme"]').content = scheme;
      } catch (e) {
        document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="icon" href="/favicon.ico" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <!--head-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
