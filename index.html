<!doctype html>
<html lang="en-CA" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1b1a18" />
    <script>
      // Apply the theme before first paint so there is no flash. Dark is the default. Mirrors src/hooks/useTheme.ts.
      try {
        var pref = localStorage.getItem('color-scheme')
        var scheme =
          pref === 'light'
            ? 'light'
            : pref === 'system'
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : 'dark'
        var root = document.documentElement
        root.setAttribute('data-theme', scheme)
        document.querySelector('meta[name="color-scheme"]').content = scheme
        document.querySelector('meta[name="theme-color"]').content = scheme === 'dark' ? '#1b1a18' : '#fbf8f1'
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <!--head-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
